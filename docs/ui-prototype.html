<title>Git Repository Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed app shell. Left rail sidebar, one main workspace that swaps screens, optional right detail pane. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#eef0f4; --line:#dde1e8; --fg:#1b2030; --mute:#667086; --faint:#98a1b3;
  --accent:#4f6bed; --accent-soft:#e6eafd; --add:#1a7f4b; --add-bg:#e3f5ea; --del:#c0392b; --del-bg:#fbe7e4;
  --mod:#a8680a; --mod-bg:#fbf0dc; --sel:#e9ecf9;
  --ui:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --panel:#161a22; --panel2:#1c212b; --line:#262c38; --fg:#dde2ec; --mute:#8d97aa; --faint:#5d667a;
  --accent:#7d93ff; --accent-soft:#232b4d; --add:#4cc38a; --add-bg:#12301f; --del:#f0716a; --del-bg:#3a1a19;
  --mod:#e5a84b; --mod-bg:#3a2c12; --sel:#1f2538; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#161a22; --panel2:#1c212b; --line:#262c38; --fg:#dde2ec; --mute:#8d97aa; --faint:#5d667a;
  --accent:#7d93ff; --accent-soft:#232b4d; --add:#4cc38a; --add-bg:#12301f; --del:#f0716a; --del-bg:#3a1a19;
  --mod:#e5a84b; --mod-bg:#3a2c12; --sel:#1f2538; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);height:100%;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)))}
.app.collapsed{grid-template-columns:52px minmax(0,1fr)}
.mono{font-family:var(--mono);font-size:12px}
.mute{color:var(--mute)} .faint{color:var(--faint)}
/* sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.repo-chip{margin:10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);display:flex;flex-direction:column;gap:2px;min-width:0}
.repo-chip b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.branch{display:flex;align-items:center;gap:5px;color:var(--accent);font:12px var(--mono)}
.nav{flex:1;overflow:auto;padding:4px 8px}
.nav h6{margin:14px 8px 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.nav a{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:5px;color:var(--mute);text-decoration:none;white-space:nowrap}
.nav a:hover{background:var(--panel2);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav a .n{margin-left:auto;font-size:11px;color:var(--faint)}
.nav svg,.ic{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px}
.side-foot a{display:flex;gap:9px;padding:6px 8px;color:var(--mute);text-decoration:none;border-radius:5px;cursor:pointer;white-space:nowrap}
.side-foot a:hover{background:var(--panel2)}
.app.collapsed .lbl,.app.collapsed .repo-chip,.app.collapsed .nav h6,.app.collapsed .nav .n{display:none}
.app.collapsed .nav a,.app.collapsed .side-foot a{justify-content:center}
/* main */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.crumb{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);background:var(--panel2);border-radius:5px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--del)}
.btn.ghost{background:transparent;border-color:transparent}
.kbd{font:11px var(--mono);padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--mute);background:var(--panel)}
.screen{flex:1;min-height:0;overflow:auto;display:none}
.screen.on{display:block}
.screen.split.on{display:grid}
.pad{padding:18px 22px;max-width:1180px}
h1{font-size:19px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:22px 0 8px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* chips */
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:9px;font:11px var(--mono);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.br{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.tag.tg{color:var(--mod);border-color:color-mix(in srgb,var(--mod) 40%,transparent);background:var(--mod-bg)}
.tag.head{background:var(--accent);color:#fff;border-color:var(--accent)}
.st{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:3px;font:600 10px var(--mono);flex:none}
.st.M{background:var(--mod-bg);color:var(--mod)} .st.A,.st.U{background:var(--add-bg);color:var(--add)} .st.D{background:var(--del-bg);color:var(--del)} .st.R{background:var(--accent-soft);color:var(--accent)}
.plus{color:var(--add)} .minus{color:var(--del)}
/* dashboard */
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:16px;display:flex;align-items:center;gap:14px;background:var(--panel)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;min-width:0;cursor:pointer}
.rc:hover{border-color:var(--accent)}
.rc .h{display:flex;align-items:center;gap:8px}
.rc .h b{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .path{font:11.5px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .f{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.star{background:none;border:0;color:var(--faint);padding:2px} .star.on{color:var(--mod)}
/* stat strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.stats div{padding:10px 14px;border-right:1px solid var(--line)} .stats div:last-child{border:0}
.stats small{display:block;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stats b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.list{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border:0}
.li.click{cursor:pointer} .li.click:hover{background:var(--panel2)}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font:600 9.5px var(--ui);color:#fff;flex:none}
/* split screens */
.split{grid-template-columns:minmax(260px,340px) minmax(0,1fr);min-height:0;overflow:hidden!important}
.split.three{grid-template-columns:minmax(300px,1.1fr) minmax(0,1fr)}
.pane{min-width:0;min-height:0;overflow:auto;background:var(--panel)}
.pane+.pane{border-left:1px solid var(--line)}
.pane.plain{background:var(--bg)}
.ph{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:8px}
.ph input,.field{height:28px;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:0 9px;min-width:0}
.ph input{flex:1}
/* tree */
.tr{display:flex;align-items:center;gap:6px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.tr:hover{background:var(--panel2)} .tr.on{background:var(--accent-soft)}
.tr .s{margin-left:auto;font:600 10px var(--mono)}
/* code */
.code{font:12px/20px var(--mono);min-width:max-content}
.cl{display:grid;grid-template-columns:150px 42px 1fr;min-width:0}
.cl .bl{color:var(--faint);padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px;cursor:default;border-right:1px solid var(--line)}
.cl .bl.first:hover{color:var(--accent)}
.cl .no{text-align:right;color:var(--faint);padding-right:10px;user-select:none}
.cl .tx{white-space:pre;padding-right:20px}
.cl.cur{background:var(--sel)}
.ghost-blame{color:var(--faint);font-style:italic;margin-left:28px;opacity:.9}
.k{color:#a572d6}.s1{color:var(--add)}.c{color:var(--faint);font-style:italic}.f1{color:var(--accent)}
:root[data-theme="light"] .k{color:#7b3fb5}
.hover{position:fixed;z-index:30;width:330px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.35);padding:12px;display:none}
.hover .m{font-weight:600;margin:6px 0}
.hover .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
/* graph */
.gr{position:relative}
.gr svg{position:absolute;left:0;top:0;pointer-events:none}
.gri{display:flex;align-items:center;height:36px;padding-right:12px;gap:8px;cursor:pointer;border-bottom:1px solid transparent;min-width:0}
.gri:hover{background:var(--panel2)} .gri.on{background:var(--accent-soft)}
.gri .m{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gri .meta{color:var(--faint);font-size:11.5px;white-space:nowrap}
.hash{font:12px var(--mono);color:var(--accent)}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;padding:12px 14px;font-size:12.5px}
.kv dt{color:var(--faint)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* diff */
.diff{display:grid;grid-template-columns:1fr 1fr;font:12px/20px var(--mono);min-width:760px}
.diff.uni{grid-template-columns:1fr}
.dh{grid-column:1/-1;padding:5px 12px;background:var(--panel2);color:var(--mute);border-block:1px solid var(--line)}
.dl{display:grid;grid-template-columns:40px 1fr;white-space:pre;min-width:0;overflow:hidden}
.dl i{font-style:normal;text-align:right;padding-right:8px;color:var(--faint);user-select:none}
.dl.a{background:var(--add-bg)} .dl.d{background:var(--del-bg)} .dl.e{background:var(--panel2);opacity:.5}
.dl.a b{color:var(--add);font-weight:400}.dl.d b{color:var(--del);font-weight:400}
.dl b{font-weight:400}
.hunk-act{display:inline-flex;gap:6px;float:right}
/* inputs */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:0 10px;height:26px;color:var(--mute)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
textarea.field{height:auto;padding:8px 9px;width:100%;resize:none;display:block}
.cb{accent-color:var(--accent)}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);text-align:left;padding:8px 12px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.bt:hover td{background:var(--panel2)}
.tw{overflow:auto}
.later{display:grid;place-items:center;height:100%;text-align:center;color:var(--mute);padding:30px}
.later div{max-width:420px}
/* palette */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40;align-items:flex-start;justify-content:center;padding-top:12vh}
.scrim.on{display:flex}
.pal{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.pal input{width:100%;height:44px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 16px;font-size:14px}
.pal .it{display:flex;gap:10px;padding:8px 16px;cursor:pointer;align-items:center}
.pal .it.on{background:var(--accent-soft)}
.pal .it span:last-child{margin-left:auto}
.toast{position:fixed;bottom:16px;right:16px;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;display:none;z-index:50}
.proto{font-size:11px;color:var(--mod);background:var(--mod-bg);padding:2px 8px;border-radius:9px}
@media(max-width:700px){
  .app{grid-template-columns:52px minmax(0,1fr)} .lbl,.repo-chip,.nav h6,.nav .n{display:none}
  .nav a,.side-foot a{justify-content:center}
  .split,.split.three{grid-template-columns:1fr} .split .pane+.pane{border-left:0;border-top:1px solid var(--line)}
  .hide-s{display:none}
}
</style>

import time
from dataclasses import dataclass

from .settings import RateLimitSettings
from .redis_client import redis


@dataclass(frozen=True)
class Decision:
    allowed: bool
    remaining: int
    retry_after: float


class SlidingWindowLimiter:
    """Allow \`limit\` requests per \`window\` seconds per key."""

    def __init__(self, cfg: RateLimitSettings):
        self.limit = cfg.limit
        self.window = cfg.window_seconds

    async def check(self, key: str) -> Decision:
        now = time.time()
        pipe = redis.pipeline()
        pipe.zremrangebyscore(key, 0, now - self.window)
        pipe.zadd(key, {str(now): now})
        pipe.zcard(key)
        _, _, count = await pipe.execute()
        remaining = max(0, self.limit - count)
        return Decision(count <= self.limit, remaining, self.window)`.split('\n');

 <div style="flex:1;overflow:auto">${grp('Unstaged',c=>!c[3])}${grp('Staged',c=>c[3])}</div>
 <div style="border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px"><input class="field" id="cm" placeholder="Commit message (required)"><textarea class="field" rows="2" placeholder="Description (optional)"></textarea><div id="ce" style="color:var(--del);font-size:12px"></div><button class="btn pri" id="cb" style="justify-content:center">Commit ${changes.filter(c=>c[3]).length} staged files <span class="kbd" style="color:#fff;background:transparent;border-color:rgba(255,255,255,.4)">⌘↵</span></button><div class="faint" style="font-size:11.5px">Files are never staged automatically.</div></div></div>
 <div class="pane plain" style="display:flex;flex-direction:column;overflow:hidden"><div class="ph"><span class="st ${changes[selChange][1]}">${changes[selChange][1]}</span><span class="mono">${changes[selChange][0]}</span><span class="spacer"></span><div class="seg"><button class="${mode==='split'?'on':''}" data-m="split">Split</button><button class="${mode==='uni'?'on':''}" data-m="uni">Unified</button></div></div>
 <div style="overflow:auto;flex:1;background:var(--panel)"><div class="diff ${mode==='uni'?'uni':''}">${mode==='split'?rowsD.join(''):`<div class="dh">${diffA[0][1]}</div>`+uni}</div></div></div>`;
 document.querySelectorAll('#s-changes .li').forEach(e=>e.onclick=ev=>{if(ev.target.type==='checkbox')return;selChange=+e.dataset.i;renderChanges()});
 document.querySelectorAll('[data-st]').forEach(b=>b.onchange=()=>{changes[+b.dataset.st][3]=b.checked;toast(b.checked?'Staged':'Unstaged');renderChanges()});
 document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{const s=b.dataset.all==='Unstaged';changes.forEach(c=>{if(c[3]!==s)c[3]=s});renderChanges()});
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;renderChanges()});
 document.querySelectorAll('#s-changes [data-t]').forEach(b=>b.onclick=()=>toast(b.dataset.t));
 $('#cb').onclick=()=>{const n=changes.filter(c=>c[3]).length;$('#ce').textContent=!$('#cm').value.trim()?'Write a commit message first.':!n?'Stage at least one file to commit.':'';if(!$('#ce').textContent)toast('Prototype: would commit '+n+' files')};
}

function renderCompare(){
 $('#s-compare').innerHTML=`<div class="pad"><h1>Compare</h1><div class="row" style="margin:10px 0 4px"><div class="seg"><button class="on">Branch ↔ branch</button><button>Commit ↔ commit</button><button>Branch ↔ working tree</button><button>HEAD ↔ working tree</button></div></div>
 <div class="row" style="margin:12px 0"><span class="mute">Base</span><select class="field"><option>main</option></select><span class="mute">←</span><span class="mute">Compare</span><select class="field"><option>feature/rate-limiter</option></select></div>
 <div class="stats"><div><small>Ahead</small><b class="plus">↑ 4</b></div><div><small>Behind</small><b class="minus">↓ 0</b></div><div><small>Files</small><b>9</b></div><div><small>Added</small><b>3</b></div><div><small>Modified</small><b>6</b></div><div><small>Lines</small><b><span class="plus">+312</span> <span class="minus">−41</span></b></div></div>
 <div class="cols"><div><h2>Changed files</h2><div class="list">${[['src/api/limiter.py','A','+182'],['tests/test_limiter.py','A','+71'],['docs/rate-limits.md','A','+38'],['src/api/routes.py','M','+6 −1'],['src/core/settings.py','M','+9'],['src/core/redis_client.py','M','+4 −2'],['pyproject.toml','M','+1'],['src/main.py','M','+2 −1']].map(f=>`<div class="li click" data-go="changes"><span class="st ${f[1]}">${f[1]}</span><span class="t mono">${f[0]}</span><span class="mono faint">${f[2]}</span></div>`).join('')}</div></div>
 <div><h2>Commits in compare, not in base</h2><div class="list">${C.slice(0,4).map(c=>`<div class="li">${av(c.a)}<span class="t">${esc(c.m)}</span><span class="hash">${c.h}</span></div>`).join('')}</div></div></div></div>`;
 document.querySelectorAll('#s-compare [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));

function renderLater(k){
 const t={search:'Global search across files, file contents (regex, case, whole word), commits, branches and tags.',tags:'Tag explorer with create, delete and compare.',stashes:'Stash manager: view diff, apply, pop, delete.',insights:'Commit activity, contributors, hot files and directories.',settings:'Appearance, Git path, diff defaults, excluded folders, shortcuts.'}[k];
 $('#s-later').innerHTML=`<div class="later"><div><h1>${names[k]}</h1><p>${t}</p><p class="faint">Designed in the plan. Not drawn in this prototype.</p></div></div>`}

/* ---------- palette & shortcuts ---------- */
const cmds=[['Open repository','⌘O',()=>go('dashboard')],['View commits','',()=>go('commits')],['View changes','',()=>go('changes')],['Compare branches','',()=>go('compare')],['Switch branch','',()=>go('branches')],['Create branch','',()=>{go('branches');setTimeout(()=>$('#nb')&&$('#nb').click(),50)}],['Search files','⇧⌘F',()=>go('files')],['Search commits','',()=>go('commits')],['Refresh repository','⌘R',()=>toast('Refreshed')],['Open settings','',()=>go('settings')]];
let pi=0;
function pal(open){$('#scrim').classList.toggle('on',open);if(open){$('#pin').value='';drawPal();$('#pin').focus()}}
function drawPal(){const q=$('#pin').value.toLowerCase(),L=cmds.filter(c=>c[0].toLowerCase().includes(q));pi=Math.min(pi,Math.max(0,L.length-1));
 $('#pitems').innerHTML=L.map((c,i)=>`<div class="it ${i===pi?'on':''}" data-i="${i}"><span>${c[0]}</span><span class="kbd">${c[1]||'↵'}</span></div>`).join('')||'<div class="it faint">No matching command</div>';
 document.querySelectorAll('#pitems .it[data-i]').forEach(e=>e.onclick=()=>{pal(false);L[+e.dataset.i][2]()});return L}
$('#pin').oninput=()=>{pi=0;drawPal()};
$('#pin').onkeydown=e=>{const L=drawPal();if(e.key==='ArrowDown'){pi=Math.min(pi+1,L.length-1);drawPal();e.preventDefault()}else if(e.key==='ArrowUp'){pi=Math.max(0,pi-1);drawPal();e.preventDefault()}else if(e.key==='Enter'&&L[pi]){pal(false);L[pi][2]()}};
$('#scrim').onclick=e=>{if(e.target.id==='scrim')pal(false)};
$('#palbtn').onclick=()=>pal(true);
addEventListener('keydown',e=>{const m=e.metaKey||e.ctrlKey;
 if(m&&e.key==='k'){e.preventDefault();pal(true)} else if(e.key==='Escape')pal(false);
 else if(m&&e.key==='b'){e.preventDefault();$('#app').classList.toggle('collapsed')}
 else if(m&&e.key==='Enter'&&cur==='changes')$('#cb')?.click()});
$('#tgl').onclick=()=>$('#app').classList.toggle('collapsed');
$('#kb').onclick=()=>toast('⌘K palette · ⌘B sidebar · ⌘O open · ⌘R refresh · ⌘↵ commit · Esc close');
document.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>go(a.dataset.go));
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
addEventListener('hashchange',()=>go(location.hash.slice(1)||'dashboard'));
renderAll();go((location.hash.slice(1))||'dashboard');
</script>
